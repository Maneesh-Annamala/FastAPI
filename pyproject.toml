[project]
name = "project-blogs"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Maneesh-Annamala", email = "maneeshannamala@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosmtplib>=5.1.3",
    "aiosqlite>=0.22.1",
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "boto3>=1.43.109",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.5",
    "pillow>=12.3.0",
    "psycopg[binary]>=3.3.6",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "sqlalchemy>=2.0.52",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.52.4",
]

[project.scripts]
project-blogs = "project_blogs:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
